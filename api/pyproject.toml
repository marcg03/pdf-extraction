[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api"
version = "0.1.0"
description = "API"
requires-python = ">=3.14"
dependencies = [
  "fastapi",
  "uvicorn",
  "valkey",
  "python-multipart"
]

[project.scripts]
api = "api.main:main"

[tool.hatch.build.targets.wheel]
packages = ["api"]
