apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-creator
  namespace: default
---
apiVersion: batch/v1
kind: Job
metadata:
  name: secret-creator
  namespace: default
spec:
  template:
    spec:
      serviceAccountName: secret-creator
      containers:
      - name: secret-creator
        image: docker.io/bitnami/kubectl:latest
        command:
          - /bin/sh
          - -c
          - |
            kubectl get secret garage-secrets >/dev/null 2>&1 && exit 0
            kubectl create secret generic garage-secrets \
              --from-literal=RPC_SECRET="$(openssl rand -hex 32)" \
              --from-literal=ADMIN_TOKEN="$(openssl rand -base64 32)" \
              --from-literal=GARAGE_DEFAULT_ACCESS_KEY="GK$(openssl rand -hex 16)" \
              --from-literal=GARAGE_DEFAULT_SECRET_KEY="$(openssl rand -hex 32)"
      restartPolicy: OnFailure
  backoffLimit: 4
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-creator
  namespace: default
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-creator
  namespace: default
subjects:
- kind: ServiceAccount
  name: secret-creator
  namespace: default
roleRef:
  kind: Role
  name: secret-creator
  apiGroup: rbac.authorization.k8s.io
